<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onion - Wallet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="logo" href="index.html"><img src="logo.png" alt="" onerror="this.style.display='none'"><span>Onion</span></a>
  <div class="auth"><a href="status.html"><button>Status</button></a></div>
</header>
<div class="ticker"><div></div></div>

<main>
  <h2>Wallet / Balance jama karein</h2>
  <p id="loginWarn" class="msg err" style="display:none">Pehle <a href="index.html" style="text-decoration:underline">Login ya Register karein</a>.</p>

  <div class="panel hidden" id="walletPanel">
    <p>Aapka balance</p>
    <div class="bal"><span id="balVal">0</span> BTC</div>
    <p>Application ke liye zaroori: <b id="needVal"></b> BTC</p>
    <div class="qr" id="qr"></div>
    <div class="addr" id="addr"></div>
    <p style="margin-top:10px;font-size:13px;color:#666">Is address par Bitcoin bhejein. Confirm hone ke baad balance badh jaata hai. Phir "Balance refresh karein" dabayein.</p>
    <button class="btn" id="refreshBal" style="margin-top:10px">Balance refresh karein</button>
    <div style="margin-top:16px"><a class="btn red" id="goApply" href="apply.html" style="display:none;display:none">Application bharein →</a></div>
    <div class="msg" id="msg"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let user = null;
async function refresh(){
  const {data:p} = await sb.from('profiles').select('balance').eq('id', user.id).single();
  const {data:f} = await sb.from('country_fees').select('btc').eq('country','default').single();
  const bal = p ? Number(p.balance) : 0, need = f ? Number(f.btc) : 0;
  document.getElementById('balVal').textContent = bal;
  document.getElementById('needVal').textContent = need;
  const g = document.getElementById('goApply');
  g.style.display = bal >= need ? 'inline-block' : 'none';
  const m = document.getElementById('msg');
  m.className = 'msg' + (bal>=need ? '' : ' err');
  m.textContent = bal>=need ? 'Balance poora hai. Ab application bhar sakte hain.' : 'Balance abhi kam hai.';
}
(async()=>{
  user = await currentUser();
  if(!user){ document.getElementById('loginWarn').style.display='block'; return; }
  document.getElementById('walletPanel').classList.remove('hidden');
  document.getElementById('addr').textContent = ONION_CONFIG.walletAddress;
  new QRCode(document.getElementById('qr'), {text: ONION_CONFIG.walletAddress, width:150, height:150});
  document.getElementById('refreshBal').onclick = refresh;
  refresh();
})();
</script>
</body>
</html>
